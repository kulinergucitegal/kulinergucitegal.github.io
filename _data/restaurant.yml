google_testimonials:
  eyebrow: "Testimoni"
  title: "Kesan pengunjung RM. APAYAA."
  # Kutipan asli dari ulasan Google, disalin apa adanya termasuk singkatan dan
  # ejaannya - itu yang membuatnya terbaca sebagai suara orang, bukan salinan
  # brosur. Potongan ditandai elipsis dan tidak mengubah kesimpulan penulisnya.
  # Jangan menulis ulang kalimatnya: begitu diparafrase, nama di bawahnya jadi
  # menyesatkan karena bukan lagi kata-kata mereka.
  subtitle: "Kutipan dari ulasan Google. Rata-rata 4,7 bintang dari 591 ulasan."
  columns:
    - duration: "22s"
      items:
        - text: "Ikan nilanya tdk berbau, sambal tdk terlalu pedas dan bisa dinikmati. Gorengan disajikan panas. Tempat nyaman, teduh, bersih, dan parkiran tersedia."
          name: "Fera Yusniawati"
          role: "Ulasan Google Maps"
        - text: "Sy memesan nasi box utk makan siang, hanya by phone, krn kami dr Solo, trus transfer dp. Makanan diantar ke parkiran bus pancuran13. Rombongan kami naik medium bus isi 34org."
          name: "sugeng samodra"
          role: "Ulasan Google Maps"
        - text: "Untuk rumah makan yg dari guci utk makan siang bisa mampir sini. Makanan bervariasi dan pas di lidah, harga aman dikantong."
          name: "Monika Hartanti"
          role: "Ulasan Google Maps"
