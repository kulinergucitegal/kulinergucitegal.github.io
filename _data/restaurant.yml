faqs:
  home:
    - question: "Apa itu RM. APAYAA?"
      answer: "RM. APAYAA Tuwel Kuliner Guci Tegal adalah rumah makan yang menyediakan berbagai macam menu pilihan, diantaranya: Sate Kambing Muda, Ayam Kampung, Sop Balungan Sapi, Sop Kambing, Gurame Goreng Bakar, Sayur Asem Sop, aneka sambal, dan aneka minuman segar. Nikmati makan dengan suasana nyaman — tersedia area indoor, lesehan, parkiran luas, mushola, dan toilet bersih. Berlokasi strategis di Jalan Raya Tuwel–Guci Bojong, hanya 5 km sebelum Wisata Guci Tegal. Kami juga menerima pesanan Catering dan Prasmanan untuk berbagai acara. Makan kenyang, kantong aman! 🍽️"
    - question: "Berapa kapasitas RM APAYAA?"
      answer: "Kapasitas total RM APAYAA sekitar 200+ tamu, mencakup area indoor dan area lesehan."
    - question: "Bagaimana cara reservasi atau tanya menu?"
      answer: "Pengunjung bisa langsung menghubungi admin melalui WhatsApp untuk tanya menu, reservasi tempat, paket rombongan, menu prasmanan, atau menu box."
  menu:
    # Urutan ditentukan pemilik. Pertanyaan soal konfirmasi harga sengaja tidak
    # ada: kalimat pembuka halaman dan CTA di bawahnya sudah menyampaikan hal
    # yang sama, dan mengulanginya membuat halaman terdengar ragu pada daftar
    # harganya sendiri.
    #
    # CATATAN: kisaran harga di jawaban pertama ditulis manual. Kalau harga
    # termurah atau termahal berubah, perbarui di sini juga.
    - question: "Menu utama RM APAYAA apa saja?"
      answer: "Ayam kampung, bebek, kambing muda, aneka sop, gurame, nila, bawal, cumi dan udang, nasi goreng, paket makan, aneka jus, dan kopi. Harga paket mulai 15 ribu untuk paket ikan asin sampai 120 ribu untuk sate satu kodi."
    - question: "Jam berapa RM APAYAA buka?"
      answer: "Buka setiap hari pukul 08.30 sampai 20.00 WIB. Khusus transit pagi rombongan Bus, bisa dibuka mulai pukul 04.00 Subuh dengan booking terlebih dahulu."
    - question: "Jam berapa RM APAYAA paling ramai?"
      answer: "Paling ramai saat akhir pekan, hari libur, dan musim liburan sekolah, terutama sekitar pukul 11.00 sampai 14.00. Pada jam tersebut waktu tunggu bisa 30 sampai 60 menit."
    - question: "Apakah bisa pesan terlebih dahulu sebelum sampai?"
      answer: "Bisa, dan justru disarankan. Kirim pesanan lewat WhatsApp admin sebelum berangkat agar makanan sudah siap begitu Anda tiba, sehingga tidak perlu menunggu di jam ramai."
    - question: "Apakah menu utama bisa dipesan untuk makan rombongan?"
      answer: "Bisa, silakan booking lewat WhatsApp. Untuk rombongan di atas 30 orang, kami sarankan mengambil menu prasmanan yang lebih hemat."
  packages:
    - question: "Menu prasmanan RM APAYAA apa saja?"
      answer: "Menu prasmanan RM APAYAA mencakup nasi liwet, pecel sayur, ikan lele, ikan nila, ayam broiler, garang asem, rendang sapi, ayam kampung, dan sate kambing. Pilihan menu bisa dikonsultasikan sesuai kebutuhan rombongan."
    - question: "Apakah bisa transit pagi sebelum ke wisata Guci?"
      answer: "Bisa, dengan booking terlebih dahulu. Transit pagi buka pukul 04.00 WIB untuk rombongan yang tiba subuh sebelum menuju wisata Guci. Tamu bisa sholat subuh, istirahat, lalu sarapan ready pukul 06:30 WIB."
    - question: "Berapa minimal order paket rombongan?"
      answer: "Minimal order paket prasmanan adalah 30 pax. Untuk jumlah tamu, jadwal kedatangan, atau kebutuhan khusus, silakan konfirmasi terlebih dahulu ke admin."
    - question: "Apakah bisa request menu?"
      answer: "Bisa. Pilihan menu dapat disesuaikan dengan kebutuhan rombongan, acara, dan jadwal kedatangan. Silakan hubungi admin untuk konsultasi menu."
  menu_box:
    - question: "Menu box RM APAYAA apa saja?"
      answer: "Menu box RM APAYAA mencakup nasi liwet, ayam broiler, ikan nila, rendang sapi, ayam kampung, sate ayam, dan sate kambing. Pilihan menu bisa dikonsultasikan sesuai kebutuhan acara atau rombongan."
    - question: "Apakah bisa diantar sampai lokasi?"
      answer: "Bisa diantar sampai lokasi. Khusus wilayah wisata Guci free ongkir, sedangkan wilayah lain menyesuaikan jarak pengantaran."
    - question: "Apakah bisa request menu?"
      answer: "Bisa. Pilihan menu dapat disesuaikan dengan kebutuhan rombongan, acara, dan jadwal kedatangan. Silakan hubungi admin untuk konsultasi menu."
  facilities:
    - question: "Fasilitas apa saja yang tersedia di RM APAYAA?"
      answer: "Fasilitas RM APAYAA meliputi area indoor, area lesehan, mushola, toilet, tempat wudhu, dan area parkir luas."
    - question: "Apakah parkir bisa untuk bus?"
      answer: "Ya, area parkir RM APAYAA dapat menampung kendaraan pribadi hingga rombongan bus pariwisata."
    - question: "Apakah tersedia mushola?"
      answer: "Ya, tersedia mushola untuk memudahkan tamu beribadah saat singgah dalam perjalanan menuju atau pulang dari Guci."
  about:
    - question: "Apakah RM APAYAA berada sebelum kawasan wisata Guci?"
      answer: "RM APAYAA berada di jalur Tuwel menuju Guci, sehingga cocok menjadi tempat singgah sebelum masuk kawasan wisata atau saat perjalanan pulang."
    - question: "Jam buka RM APAYAA?"
      answer: "Jam buka yang tercantum adalah setiap hari pukul 09.00 sampai 20.00 WIB. Untuk kunjungan rombongan, sebaiknya tetap konfirmasi lewat WhatsApp."
    - question: "Apakah bisa tanya rute lewat WhatsApp?"
      answer: "Bisa. Pengunjung dapat menghubungi admin lewat WhatsApp untuk bertanya rute, reservasi, dan kesiapan tempat."
  tourism:
    - question: "Apakah website ini juga menyediakan info wisata Guci?"
      answer: "Ya, halaman info wisata Guci disediakan sebagai informasi pendukung untuk pengunjung yang sedang merencanakan perjalanan ke kawasan Guci."
    - question: "Apakah informasi tiket wisata Guci selalu tetap?"
      answer: "Informasi tiket dapat berubah sewaktu-waktu, sehingga pengunjung tetap disarankan melakukan verifikasi terbaru sebelum berangkat."
    - question: "Apakah bisa makan dulu sebelum naik ke wisata Guci?"
      answer: "Bisa. RM APAYAA berada di jalur menuju Guci dan cocok menjadi titik singgah makan untuk keluarga maupun rombongan."
  whatsapp:
    - question: "Untuk apa menghubungi WhatsApp RM APAYAA?"
      answer: "WhatsApp dapat digunakan untuk tanya menu, reservasi, paket prasmanan, menu box, kapasitas rombongan, dan rute menuju RM APAYAA."
    - question: "Apakah bisa reservasi rombongan lewat WhatsApp?"
      answer: "Ya, reservasi rombongan sangat disarankan melalui WhatsApp agar waktu kedatangan, jumlah tamu, dan pilihan menu bisa dikoordinasikan."
    - question: "Apakah admin bisa membantu rekomendasi menu?"
      answer: "Bisa. Admin dapat membantu menyesuaikan pilihan menu dengan kebutuhan keluarga, rombongan, acara, atau konsumsi praktis."
  maps_order:
    - question: "Apakah bisa pesan langsung dari Google Maps?"
      answer: "Pengunjung dari Google Maps bisa memakai halaman order ini untuk membuka WhatsApp admin, melihat menu, dan membuka rute menuju RM APAYAA."
    - question: "Apakah pesanan dikonfirmasi lewat Google Maps?"
      answer: "Konfirmasi pesanan, reservasi, jumlah porsi, dan jam kedatangan dilakukan lewat WhatsApp admin agar informasinya lebih cepat dan jelas."
    - question: "Apakah halaman ini bisa dipakai untuk link Order online di Google Business Profile?"
      answer: "Ya, halaman ini dirancang sebagai halaman khusus untuk pengunjung dari Google Maps atau Google Business Profile."
order_terms:
  eyebrow: "Sebelum Memesan"
  title: "Syarat & ketentuan pemesanan"
  note: "Mohon dibaca terlebih dahulu sebelum melakukan pemesanan menu catering, prasmanan, atau menu box."
  points:
    - "Pesanan menu utama dilakukan minimal 3 jam sebelum acara."
    - "Pesanan menu catering dan prasmanan dilakukan minimal H-1 sebelum acara."
    - "Pesanan menu khusus (request dari customer) dilakukan minimal H-3 sebelum acara."
    - "Menu yang sudah disepakati tidak dapat dikurangi, kecuali penambahan menu. Contoh: pesanan awal 50 pax tetapi hadir 40 pax, kelebihan makanan tetap menjadi tanggung jawab customer. Jika pesanan awal 50 pax lalu hadir 60 pax, penambahan dapat dilayani selama persediaan masih ada."
    - "Pembayaran DP minimal 30% dari total transaksi."
    - "Transit di rumah makan dimulai pukul 04.00 WIB dan makanan paling cepat disajikan pukul 06.30 WIB."
    - "DP tidak dapat dikembalikan apabila customer melakukan pembatalan pesanan."
    - "Customer wajib melampirkan bukti pembayaran DP."
    - "Dengan melakukan pembayaran DP, customer dianggap telah memahami dan menyetujui seluruh syarat dan ketentuan yang berlaku."
    - "Pembayaran DP hanya melalui transfer Bank BCA. Nomor rekening resmi dikonfirmasi langsung oleh admin lewat WhatsApp, sehingga mohon tidak melakukan transfer ke rekening lain."
  warning: "Waspada penipuan: RM. APAYAA tidak pernah meminta transfer ke rekening selain yang dikonfirmasi admin melalui WhatsApp resmi di nomor pada halaman ini."
